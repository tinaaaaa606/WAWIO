<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Menu Preview – WAWIO Demo</title>
<style>
  :root {
    --nav: #1d3f73; --nav2: #16335f; --ticket: #a9d3e3; --ticket-head: #5aa0a8; --total: #1764b5;
    --panel: #ffffff; --bar: #e3e5e8; --ink: #111827; --muted: #6b7280; --green: #12b81c; --red: #d93131;
    --pink: #f07fe6; --gap: 4px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f1d33; color: var(--ink);
    font-family: Arial, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; border: 0; }
  .app { height: 100dvh; display: grid; grid-template-rows: 34px 1fr auto; background: #fff; max-width: 1400px; margin: 0 auto; }

  /* top bar */
  .top { background: linear-gradient(var(--nav), var(--nav2)); color: #fff; display: flex; align-items: center;
    gap: 16px; padding: 0 12px; font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; }
  .top .brand { color: #ffd34d; }
  .top .rest { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; }
  .top .note { font-weight: normal; font-size: 12px; color: #c7d6ef; }

  /* main area */
  .main { display: grid; grid-template-columns: minmax(260px, 33%) minmax(170px, 22%) 1fr; gap: 6px; padding: 6px; min-height: 0; background: #f3f4f6; }

  /* ticket */
  .ticket { display: grid; grid-template-rows: auto 1fr auto auto; min-height: 0; background: #fff; border: 1px solid #c9d3dc; }
  .ticket .head { background: var(--ticket-head); color: #fff; font-size: 12px; padding: 6px 8px; display: flex; justify-content: space-between; }
  .lines { background: #fff; overflow-y: auto; min-height: 0; }
  .line { display: grid; grid-template-columns: 1fr auto 28px; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #eef2f5; font-size: 14px; }
  .line .mods { grid-column: 1 / 3; color: #374151; font-size: 12.5px; padding-left: 14px; }
  .line .mods div { display: flex; justify-content: space-between; }
  .line .x { grid-row: 1; grid-column: 3; background: #fde2e2; color: var(--red); border-radius: 4px; font-weight: bold; height: 24px; }
  .empty-ticket { color: var(--muted); font-size: 13px; padding: 14px 10px; line-height: 1.5; }
  .sub { background: var(--ticket); padding: 6px 8px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; }
  .tot { background: var(--total); color: #fff; padding: 8px; font-size: 20px; font-weight: bold; display: flex; justify-content: space-between; }

  /* grids */
  .col { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; gap: 4px; }
  .colhead { background: #cdeef0; padding: 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .grid { display: grid; gap: var(--gap); min-height: 0; }
  .btn { border-radius: 2px; padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; line-height: 1.12; position: relative; overflow: hidden; word-break: break-word; min-height: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); transition: filter .1s; }
  .btn:active { filter: brightness(.88); }
  .btn.sel { outline: 2px solid #1764b5; outline-offset: -2px; }
  .btn .nm { font-size: clamp(12px, 1.55vw, 20px); }
  .gbtn .nm { font-size: clamp(12px, 1.4vw, 19px); }
  .btn.long .nm { font-size: clamp(11px, 1.2vw, 16px); }
  .btn .pr { font-size: 11px; opacity: .75; margin-top: 3px; font-weight: bold; }
  .btn .zero { position: absolute; top: 0; right: 0; background: var(--red); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 4px; }
  .btn .flag { position: absolute; top: 2px; left: 3px; font-size: 13px; }
  .pager { display: flex; gap: 4px; justify-content: space-between; }
  .pager button { flex: 1; background: #fff; border: 1px solid #c9d3dc; color: #8fb3e6; font-size: 18px; padding: 6px 0; }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager span { align-self: center; font-size: 12px; color: var(--muted); padding: 0 6px; white-space: nowrap; }
  .reporting .ibtn { box-shadow: inset 0 0 0 3px var(--pink); }

  /* bottom bar */
  .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 6px; background: #f3f4f6; border-top: 1px solid #dde1e6; }
  .bar button { background: var(--bar); padding: 12px 6px; font-size: 14px; border-radius: 2px; color: #1f2937; }
  .bar .report.on { background: var(--pink); color: #fff; }
  .bar .changes { background: var(--total); color: #fff; }
  .bar .approve { background: var(--green); color: #fff; font-weight: bold; }
  .bar .count { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 12px; margin-left: 4px; }

  /* modal */
  .ov { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); display: none; align-items: center; justify-content: center; z-index: 20; padding: 10px; }
  .ov.show { display: flex; }
  .modal { background: #fff; width: min(980px, 100%); max-height: 94dvh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .modal .mt { font-size: 12px; padding: 6px 10px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; }
  .fc { display: grid; grid-template-columns: 250px 1fr; gap: 12px; padding: 10px; min-height: 360px; overflow: auto; }
  .fc .left { border-right: 1px solid #eef0f3; padding-right: 10px; font-size: 14px; }
  .fc .left .ln { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center; }
  .fc .left .qty { border: 1px solid #9ca3af; border-radius: 4px; text-align: center; padding: 6px 0; }
  .fc .left .picked { margin-top: 8px; font-size: 13px; color: #374151; }
  .fc .left .picked div { display: flex; justify-content: space-between; padding: 2px 0 2px 38px; }
  .fc .left .desc { margin-top: 12px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .step-title { text-decoration: underline; font-size: 16px; margin: 2px 0 4px; }
  .step-rule { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .step-rule b { color: var(--red); }
  .choices { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .choice { min-height: 70px; font-size: 16px; color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; text-align: center; }
  .choice small { font-size: 11px; font-weight: bold; margin-top: 4px; opacity: .8; }
  .choice.on { outline: 3px solid #1d3f73; outline-offset: -3px; filter: brightness(.9); }
  .steps-dots { display: flex; gap: 4px; margin-bottom: 8px; }
  .steps-dots i { width: 22px; height: 4px; background: #d1d5db; border-radius: 2px; }
  .steps-dots i.done { background: #1764b5; }
  .mfoot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px; border-top: 1px solid #eef0f3; flex-wrap: wrap; }
  .mfoot button { padding: 14px 22px; font-size: 16px; border-radius: 2px; }
  .mfoot .ghost { background: var(--bar); }
  .mfoot .cancel { background: var(--red); color: #fff; min-width: 120px; }
  .mfoot .done { background: var(--green); color: #fff; min-width: 140px; font-weight: bold; }
  .mfoot .done:disabled { opacity: .45; cursor: default; }
  .mfoot .rep { margin-right: auto; background: #fde7fb; color: #9d1a8e; }
  .pad { padding: 16px; font-size: 15px; line-height: 1.55; overflow: auto; }
  .pad h2 { margin: 0 0 10px; font-size: 20px; }
  .pad textarea { width: 100%; min-height: 110px; font: inherit; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
  .issue { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eef0f3; }
  .issue b { display: block; }
  .issue button { background: #fde2e2; color: var(--red); padding: 6px 10px; border-radius: 4px; }
  .hint { background: #fef3c7; padding: 10px 12px; border-radius: 6px; font-size: 14px; }
  .steps-help { padding-left: 20px; }
  .steps-help li { margin-bottom: 6px; }

  /* mobile */
  .mobile-only { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-rows: 34px auto 1fr auto; height: 100dvh; }
    .top .note { display: none; }
    .main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; padding: 4px; gap: 4px; overflow: hidden; }
    .ticket { display: none; }
    .ticket.open { display: grid; position: fixed; inset: 34px 0 0 0; z-index: 15; }
    .col.groups .colhead, .col.groups .pager { display: none; }
    .col.groups .grid { display: flex !important; overflow-x: auto; gap: 4px; padding-bottom: 2px; }
    .col.groups .gbtn { flex: 0 0 auto; min-width: 104px; height: 52px; }
    .col.items { min-height: 0; }
    .col.items .grid { grid-template-columns: repeat(2, 1fr) !important; grid-auto-rows: 74px; grid-template-rows: none !important; overflow-y: auto; align-content: start; }
    .col.items .grid .ibtn { grid-row: auto !important; grid-column: auto !important; }
    .col.items .grid .blank { display: none; }
    .col.items .pager { display: none; }
    .btn .nm { font-size: 15px; }
    .mobile-only { display: flex; }
    .orderbar { background: var(--total); color: #fff; padding: 10px 12px; font-weight: bold; justify-content: space-between; align-items: center; }
    .orderbar button { background: rgba(255,255,255,.18); color: #fff; padding: 6px 10px; border-radius: 4px; }
    .bar { grid-template-columns: repeat(2, 1fr); }
    .bar .clear, .bar .issues { display: none; }
    .bar .report { grid-column: 1 / 3; }
    .fc { grid-template-columns: 1fr; min-height: 0; }
    .fc .left { border-right: 0; border-bottom: 1px solid #eef0f3; padding: 0 0 8px; }
    .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .choice { min-height: 58px; }
    .mfoot button { flex: 1; padding: 13px 10px; }
    .mfoot .rep { flex-basis: 100%; }
    .ticket .closeT { display: inline-block !important; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <span class="brand">Menu Preview</span>
    <span class="rest" id="restName"></span>
    <span class="note">For menu review only – not a real order</span>
  </div>

  <div class="main" id="main">
    <section class="ticket" id="ticket">
      <div class="head"><span>Sample Order · Dine In</span><span><button class="closeT" style="display:none;background:none;color:#fff;font-size:14px" onclick="toggleTicket(false)">Close ✕</button></span></div>
      <div class="lines" id="lines"></div>
      <div class="sub"><span>Sub Total</span><span id="subTotal">$0.00</span></div>
      <div class="tot"><span>Total</span><span id="total">$0.00</span></div>
    </section>

    <section class="col groups">
      <div class="colhead"><span>MENU</span></div>
      <div class="grid" id="groupGrid"></div>
      <div class="pager"><button id="gPrev">◀</button><span id="gPageLbl"></span><button id="gNext">▶</button></div>
    </section>

    <section class="col items" id="itemsCol">
      <div class="colhead"><span id="groupTitle"></span><span style="font-size:12px;color:#6b7280">Tap an item to try it</span></div>
      <div class="grid" id="itemGrid"></div>
      <div class="pager"><button id="iPrev">◀</button><span id="iPageLbl"></span><button id="iNext">▶</button></div>
    </section>
  </div>

  <div class="orderbar mobile-only" id="orderbar"><span id="mobTotal">Order · $0.00</span><button onclick="toggleTicket(true)">View order</button></div>

  <div class="bar">
    <button class="clear" onclick="clearOrder()">Clear Order</button>
    <button class="report" id="reportBtn" onclick="toggleReport()">🚩 Report an Issue</button>
    <button class="issues" onclick="openIssues()">Issues<span class="count" id="issueCount">0</span></button>
    <button class="changes" onclick="openIssues()">Request Changes</button>
    <button class="approve" onclick="openApprove()">Approve Menu</button>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

/* ---------- categories ---------- */
function renderGroups() {
  const g = DATA.groupGrid, el = $('groupGrid');
  el.style.gridTemplateColumns = `repeat(${g.cols}, 1fr)`;
  el.style.gridTemplateRows = `repeat(${g.rows}, 1fr)`;
  const mobile = matchMedia('(max-width: 820px)').matches;
  const list = mobile ? DATA.groups : DATA.groups.filter(x => x.page === gPage);
  el.innerHTML = list.map(x => `<button class="btn gbtn${x.id === selGroup ? ' sel' : ''}" style="grid-row:${x.row};grid-column:${x.col};background:${x.bg};color:${x.fg}" onclick="pickGroup(${x.id})"><span class="nm">${esc(x.name)}</span></button>`).join('');
  $('gPageLbl').textContent = `${gPage} / ${g.pages}`;
  $('gPrev').disabled = gPage <= 1; $('gNext').disabled = gPage >= g.pages;
}
function pickGroup(id) { selGroup = id; iPage = 1; renderGroups(); renderItems(); }

/* ---------- menu items ---------- */
function priceLabel(it) {
  if (it.open) return 'Open price';
  if (it.sizes.length) return it.sizes.map(s => `${s.name} ${fmt(s.price)}`).join(' · ');
  return fmt(it.price);
}
const isZero = it => !it.open && !it.combo && !it.sizes.length && it.price === 0;
const flagged = name => issues.some(i => i.item === name);

function renderItems() {
  const g = DATA.itemGrid, el = $('itemGrid');
  const grp = DATA.groups.find(x => x.id === selGroup);
  $('groupTitle').textContent = grp ? grp.name : '';
  const all = DATA.layout[String(selGroup)] || [];
  const pages = Math.max(1, ...all.map(x => x.page));
  const mobile = matchMedia('(max-width: 820px)').matches;
  const list = mobile ? all : all.filter(x => x.page === iPage);
  el.style.gridTemplateColumns = `repeat(${g.cols}, 1fr)`;
  el.style.gridTemplateRows = `repeat(${g.rows}, 1fr)`;
  el.innerHTML = list.length ? list.map(x => {
    const it = DATA.items[String(x.id)]; if (!it) return '';
    return `<button class="btn ibtn${it.name.length > 16 ? ' long' : ''}" style="grid-row:${x.row};grid-column:${x.col};background:${x.bg};color:${x.fg}" onclick="tapItem(${x.id})">
      ${flagged(it.name) ? '<span class="flag">🚩</span>' : ''}${isZero(it) ? '<span class="zero">$0</span>' : ''}
      <span class="nm">${esc(it.name)}</span><span class="pr">${esc(priceLabel(it))}</span></button>`;
  }).join('') : `<div class="empty-ticket" style="grid-column:1/-1">No items in this category.</div>`;
  $('iPageLbl').textContent = `${iPage} / ${pages}`;
  $('iPrev').disabled = iPage <= 1; $('iNext').disabled = iPage >= pages;
}

/* ---------- ordering flow (size → combo → forced choices) ---------- */
let flow = null;
function tapItem(id) {
  const it = DATA.items[String(id)];
  if (reportMode) return openReport(it.name);
  const steps = [];
  if (it.sizes.length) steps.push({ type: 'size' });
  (it.combo || []).forEach((c, i) => steps.push({ type: 'combo', i }));
  it.forced.forEach(f => { const g = DATA.modGroups[String(f.g)]; if (g && g.mods.length) steps.push({ type: 'mod', f, g }); });
  flow = { it, steps, idx: 0, size: null, picks: steps.map(() => []) };
  if (!steps.length) return finishFlow();
  renderFlow();
}
function sizeIndex() { return flow.size ? flow.size.i : 0; }
function stepOptions(st) {
  if (st.type === 'size') return flow.it.sizes.map(s => ({ key: 's' + s.i, name: s.name, price: s.price, bg: '#9AD0F5' }));
  if (st.type === 'combo') return flow.it.combo[st.i].opts.map(o => ({ key: 'c' + o.id, name: o.name, price: 0, bg: '#B9FBC0' }));
  return st.g.mods.map(mid => { const m = DATA.mods[String(mid)]; return { key: 'm' + mid, name: m.name, price: m.p[sizeIndex()] || 0, bg: st.g.bg }; });
}
function stepRule(st) {
  if (st.type === 'size') return { min: 1, max: 1, title: 'Choose a size' };
  if (st.type === 'combo') return { min: 1, max: 1, title: flow.it.combo[st.i].label };
  return { min: st.f.min, max: st.f.max, title: st.g.name };
}
function linePreview() {
  const it = flow.it; let base = flow.size ? flow.size.price : it.price; const rows = [];
  if (flow.size) rows.push([flow.size.name, 0]);
  flow.steps.forEach((st, i) => { if (st.type !== 'size') flow.picks[i].forEach(p => rows.push([p.name, p.price])); });
  return { base, rows, total: base + rows.reduce((a, r) => a + r[1], 0) };
}
function renderFlow() {
  const st = flow.steps[flow.idx], rule = stepRule(st), opts = stepOptions(st), picks = flow.picks[flow.idx];
  const pv = linePreview(), last = flow.idx === flow.steps.length - 1, ok = picks.length >= rule.min;
  const ruleTxt = rule.min === rule.max ? `Required · choose <b>${rule.min}</b>` : `Required · choose <b>${rule.min}–${rule.max}</b>`;
  $('modal').innerHTML = `
    <div class="mt"><span>Forced Choices</span><span>${flow.idx + 1} of ${flow.steps.length}</span></div>
    <div class="fc">
      <div class="left">
        <div class="ln"><span class="qty">1</span><span>${esc(flow.it.name)}</span><span>${fmt(pv.base)}</span></div>
        <div class="picked">${pv.rows.map(r => `<div><span>${esc(r[0])}</span><span>${r[1] ? fmt(r[1]) : ''}</span></div>`).join('')}</div>
        ${flow.it.desc ? `<div class="desc">${esc(flow.it.desc)}</div>` : ''}
      </div>
      <div>
        <div class="steps-dots">${flow.steps.map((_, i) => `<i class="${i <= flow.idx ? 'done' : ''}"></i>`).join('')}</div>
        <div class="step-title">${esc(rule.title)}</div>
        <div class="step-rule">${ruleTxt}</div>
        <div class="choices">${opts.map(o => `<button class="choice${picks.some(p => p.key === o.key) ? ' on' : ''}" style="background:${o.bg}" onclick="pickOpt('${o.key}')"><span>${esc(o.name)}</span>${o.price ? `<small>+${fmt(o.price)}</small>` : ''}</button>`).join('')}</div>
      </div>
    </div>
    <div class="mfoot">
      <button class="rep" onclick="openReport(NAMES[${nref(flow.it.name)}])">🚩 Something wrong with this item?</button>
      ${flow.idx > 0 ? '<button class="ghost" onclick="flowBack()">Back</button>' : ''}
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="done" ${ok ? '' : 'disabled'} onclick="flowNext()">${last ? 'DONE' : 'NEXT'}</button>
    </div>`;
  showModal();
}
function pickOpt(key) {
  const st = flow.steps[flow.idx], rule = stepRule(st), opts = stepOptions(st), o = opts.find(x => x.key === key);
  let picks = flow.picks[flow.idx];
  if (picks.some(p => p.key === key)) picks = picks.filter(p => p.key !== key);
  else if (rule.max === 1) picks = [o];
  else if (picks.length < rule.max) picks = picks.concat(o);
  flow.picks[flow.idx] = picks;
  if (st.type === 'size') { flow.size = picks.length ? flow.it.sizes.find(s => 's' + s.i === picks[0].key) : null; }
  if (rule.max === 1 && picks.length === 1 && flow.idx < flow.steps.length - 1) { flow.idx++; }
  renderFlow();
}
function flowBack() { flow.idx--; renderFlow(); }
function flowNext() { if (flow.idx < flow.steps.length - 1) { flow.idx++; renderFlow(); } else finishFlow(); }
function finishFlow() {
  const pv = flow.steps.length ? linePreview() : { base: flow.it.price, rows: [], total: flow.it.price };
  order.push({ name: flow.it.name + (flow.size ? ` (${flow.size.name})` : ''), base: pv.base, mods: pv.rows.filter(r => !flow.size || r[0] !== flow.size.name), total: pv.total });
  closeModal(); renderOrder();
}

/* ---------- ticket ---------- */
function renderOrder() {
  const el = $('lines');
  el.innerHTML = order.length ? order.map((l, i) => `<div class="line"><span>1 &nbsp;${esc(l.name)}</span><span>${fmt(l.base)}</span><button class="x" onclick="removeLine(${i})">✕</button>
    ${l.mods.length ? `<div class="mods">${l.mods.map(m => `<div><span>- ${esc(m[0])}</span><span>${m[1] ? fmt(m[1]) : ''}</span></div>`).join('')}</div>` : ''}</div>`).join('')
    : `<div class="empty-ticket">Tap a category, then tap menu items to build a sample order.<br>Prices and required choices work just like on your POS.</div>`;
  const t = order.reduce((a, l) => a + l.total, 0);
  $('subTotal').textContent = fmt(t); $('total').textContent = fmt(t);
  $('mobTotal').textContent = `Order (${order.length}) · ${fmt(t)}`;
}
function removeLine(i) { order.splice(i, 1); renderOrder(); }
function clearOrder() { order = []; renderOrder(); }
function toggleTicket(open) { $('ticket').classList.toggle('open', open); }

/* ---------- issues ---------- */
function toggleReport() {
  reportMode = !reportMode;
  $('reportBtn').classList.toggle('on', reportMode);
  $('reportBtn').textContent = reportMode ? '🚩 Tap an item to report… (tap to stop)' : '🚩 Report an Issue';
  $('main').classList.toggle('reporting', reportMode);
}
function openReport(itemName) {
  const existing = issues.find(i => i.item === itemName);
  $('modal').innerHTML = `
    <div class="mt"><span>Report an issue</span><span></span></div>
    <div class="pad">
      <h2>${esc(itemName || 'General')}</h2>
      <p style="margin-top:0;color:#6b7280">Tell us what's wrong or missing – name, price, choices, description, anything.</p>
      <textarea id="issueText" placeholder="e.g. Price should be $12.95 / Add Shrimp as a choice / Remove this item">${existing ? esc(existing.note) : ''}</textarea>
    </div>
    <div class="mfoot"><button class="cancel" onclick="closeModal()">Cancel</button><button class="done" onclick="saveIssue(NAMES[${nref(itemName || 'General')}])">Save</button></div>`;
  showModal(); setTimeout(() => $('issueText').focus(), 50);
}
function saveIssue(itemName) {
  const note = $('issueText').value.trim();
  issues = issues.filter(i => i.item !== itemName);
  if (note) issues.push({ item: itemName, note });
  saveIssues(); closeModal(); updateIssueCount(); renderItems();
}
function updateIssueCount() { $('issueCount').textContent = issues.length; }
function issuesText() { return issues.map(i => `• ${i.item}: ${i.note}`).join('\n'); }
function openIssues() {
  $('modal').innerHTML = `
    <div class="mt"><span>Request changes</span><span></span></div>
    <div class="pad">
      <h2>Changes you've reported (${issues.length})</h2>
      ${issues.length ? issues.map((i, n) => `<div class="issue"><div><b>${esc(i.item)}</b>${esc(i.note)}</div><div><button onclick="openReport(NAMES[${nref(i.item)}])">Edit</button> <button onclick="delIssue(${n})">Delete</button></div></div>`).join('')
        : `<p class="hint">No issues yet. Tap <b>🚩 Report an Issue</b>, then tap any item that needs a change.</p>`}
      <p style="margin-top:14px"><button class="ghost" style="background:#e3e5e8;padding:10px 14px" onclick="openReport('General')">+ Add a general note (not about one item)</button></p>
    </div>
    <div class="mfoot"><button class="ghost" onclick="closeModal()">Keep reviewing</button><button class="done" ${issues.length ? '' : 'disabled'} onclick="sendChanges()">Send changes to Wawio</button></div>`;
  showModal();
}
function delIssue(n) { issues.splice(n, 1); saveIssues(); updateIssueCount(); renderItems(); openIssues(); }

function formLink(decision, notes) {
  const p = new URLSearchParams({ restaurant: DATA.restaurant, decision, task_id: TASK_ID, token: TOKEN });
  if (notes) p.set('change_notes', notes);
  return FORM_URL + '?' + p.toString();
}
function sendChanges() {
  const text = issuesText();
  if (TASK_ID && TOKEN && FORM_URL.startsWith('http')) { location.href = formLink('Request changes', text.slice(0, 1500)); return; }
  noLinkModal('Request changes', text);
}
function openApprove() {
  $('modal').innerHTML = `
    <div class="mt"><span>Approve menu</span><span></span></div>
    <div class="pad">
      <h2>Everything looks good?</h2>
      ${issues.length ? `<p class="hint">You still have <b>${issues.length}</b> reported issue(s). If those need fixing, tap <b>Request Changes</b> instead.</p>` : ''}
      <p>By approving, you confirm the menu items, prices and choices are correct and ready to go live.</p>
    </div>
    <div class="mfoot"><button class="ghost" onclick="closeModal()">Keep reviewing</button><button class="done" onclick="approve()">Yes, approve menu</button></div>`;
  showModal();
}
function approve() {
  if (TASK_ID && TOKEN && FORM_URL.startsWith('http')) { location.href = formLink('Approve'); return; }
  noLinkModal('Approve', 'Menu approved.');
}
function noLinkModal(decision, text) {
  $('modal').innerHTML = `
    <div class="mt"><span>${esc(decision)}</span><span></span></div>
    <div class="pad">
      <h2>Almost done</h2>
      <p>Please <b>reply to the email we sent you</b> and paste the text below (or call us at 818-942-6160).</p>
      <textarea readonly id="copyText">${esc(text)}</textarea>
      <p><button class="ghost" style="background:#e3e5e8;padding:10px 14px" onclick="navigator.clipboard && navigator.clipboard.writeText($('copyText').value); this.textContent='Copied ✓'">Copy text</button></p>
    </div>
    <div class="mfoot"><button class="done" onclick="closeModal()">OK</button></div>`;
  showModal();
}

/* ---------- modal + boot ---------- */
function showModal() { $('ov').classList.add('show'); }
function closeModal() { $('ov').classList.remove('show'); flow = null; }
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') closeModal(); });
$('gPrev').onclick = () => { gPage--; renderGroups(); };
$('gNext').onclick = () => { gPage++; renderGroups(); };
$('iPrev').onclick = () => { iPage--; renderItems(); };
$('iNext').onclick = () => { iPage++; renderItems(); };
addEventListener('resize', () => { renderGroups(); renderItems(); });

function welcome() {
  $('modal').innerHTML = `
    <div class="mt"><span>Welcome</span><span></span></div>
    <div class="pad">
      <h2>Review your POS menu – ${esc(DATA.restaurant)}</h2>
      <p>This page works like the menu screen on your new POS. Nothing here is a real order.</p>
      <ol class="steps-help">
        <li>Tap a <b>category</b>, then tap <b>menu items</b>. Pick sizes and required choices just like at the register.</li>
        <li>Check <b>names, prices, sizes and choices</b>. Items marked <span style="background:#d93131;color:#fff;font-size:11px;padding:1px 4px;font-weight:bold">$0</span> have no price yet.</li>
        <li>See something wrong or missing? Tap <b>🚩 Report an Issue</b>, then tap the item and tell us what to change.</li>
        <li>When you're done, tap <b>Request Changes</b> to send your notes, or <b>Approve Menu</b> if everything is correct.</li>
      </ol>
    </div>
    <div class="mfoot"><button class="done" onclick="closeModal()">Start reviewing</button></div>`;
  showModal();
}

$('restName').textContent = DATA.restaurant;
selGroup = (DATA.groups.find(g => g.page === 1) || DATA.groups[0] || {}).id;
renderGroups(); renderItems(); renderOrder(); updateIssueCount(); welcome();
</script>
</body>
</html>
