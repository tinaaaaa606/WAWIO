    top:0;

  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:14px;
  }
  header h1{
    margin:0;
    font-family:Georgia, serif;
    font-size:20px;
    font-weight:700;
  }
  header p{
    margin:2px 0 0;
    font-size:12px;
    color:rgba(255,255,255,0.85);
  }
  .actions{display:flex; gap:8px; flex-wrap:wrap;}
  button{
    font-family:Arial, sans-serif;
    font-size:13px;
    font-weight:700;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:#fff; color:var(--red);}
  .btn-secondary{background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.4);}
  .btn-ghost{background:transparent; color:rgba(255,255,255,0.85); border:1px dashed rgba(255,255,255,0.5);}

    color:rgba(255,255,255,0.85);
    border:1px solid rgba(255,255,255,0.3);
    padding:9px 18px;
    border-radius:20px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .tab-btn.active{
    background:#fff;
    color:var(--red);
    border-color:#fff;
  }

  .layout{
    display:grid;
    grid-template-columns:380px 1fr;
    gap:0;
    align-items:start;
    min-height:calc(100vh - 116px);
  }
  @media (max-width: 880px){
    .layout{grid-template-columns:1fr;}
  }

    padding:20px;
    max-height:calc(100vh - 116px);
    overflow-y:auto;

    background:#fff;
  }

    background:var(--card-cream);

    padding:16px;
    margin-bottom:16px;
  }

    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--red);

  }

    align-items:baseline;
    font-size:12px;
    font-weight:700;
    color:var(--ink);

    color:var(--muted);

  }

    width:100%;
    padding:9px 10px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:13px;
    font-family:Arial, sans-serif;
    background:#fff;
  }
  .field input:focus{
    outline:none;
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(230,126,34,0.15);
  }
  .hint{font-size:11px; color:var(--faint); margin-top:3px; line-height:1.4;}

  .preview-panel{
    padding:24px;
    overflow-y:auto;
    max-height:calc(100vh - 116px);
  }
  .preview-frame-wrap{
    max-width:680px;
    margin:0 auto;
    background:var(--cream);
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);

    width:100%;
    height:1900px;
    border:none;
    display:block;
  }

    max-width:680px;
    margin:0 auto 12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    font-size:12px;

    border-radius:20px;

  .pill.missing{background:#fdecea; color:var(--warn);}

    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#222;
    color:#fff;
    padding:10px 20px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:100;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>

            {id:"guide_qr_img", th:"QR Quick Guide", type:"url", default:"https://www.blizzstatic.com/dynamicmedia/image/765/69c305f9461e5.png"}
          ]
        },
        {

          hint: "สอง QR นี้ generate เฉพาะร้าน — อัปโหลดรูปไว้ที่ไหนก็ได้ แล้ววาง URL ตรงนี้",
          fields: [
            {id:"ordering_qr_img", th:"QR Online Ordering", en:"required", required:true, type:"url", placeholder:"วาง URL รูปที่อัปโหลดไว้แล้ว"},
            {id:"website_qr_img", th:"QR เว็บไซต์หลัก", en:"required", required:true, type:"url", placeholder:"วาง URL รูปที่อัปโหลดไว้แล้ว"}

        ordering_qr_img:"https://www.blizzstatic.com/dynamicmedia/image/16008/6a3569e97d1cb.png",
        website_qr_img:"https://www.blizzstatic.com/dynamicmedia/image/16008/6a35697fc5dab.png"
      }
    },
    deliverect: {
      label: "🚀 Deliverect",
      title: "🚀 Wawio Onboarding Email Generator — Deliverect",
      tplId: "tpl-deliverect",
      groups: [
        {
          title: "ข้อมูลลูกค้า · Customer",
          fields: [
            {id:"owner_full_name", th:"ชื่อเจ้าของร้าน", en:"Owner Full Name", required:true, placeholder:"เช่น Somchai Jaidee"},
            {id:"account_name", th:"ชื่อร้าน", en:"Account / Restaurant Name", required:true, placeholder:"เช่น Siam Grill LA"}
          ]
        },
        {
          title: "Portal Credentials",
          fields: [
            {id:"login_id", th:"Username", en:"Deliverect Login ID", required:true, placeholder:"เช่น siamgrillla_dlv"},
            {id:"password", th:"Password", required:true, placeholder:"เช่น Welcome2026!"}
          ]
        }
      ],
      sample: {
        owner_full_name:"Somchai Jaidee",
        account_name:"Siam Grill LA",
        login_id:"siamgrillla_dlv",
        password:"Deliver2026!"
      }
    }
  };

  let activeKey = "blizzfull";

  function esc(str){
    return String(str ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function allFields(t){
    return t.groups.flatMap(g => g.fields);
  }

  function renderTabs(){
    const bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    Object.entries(TEMPLATES).forEach(([key, t]) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (key === activeKey ? ' active' : '');
      btn.textContent = t.label;
      btn.addEventListener('click', () => {
        activeKey = key;
        renderTabs();
        renderForm();
        renderPreview();
      });
      bar.appendChild(btn);
    });
  }

  function renderForm(){
    const t = TEMPLATES[activeKey];
    document.getElementById('toolTitle').textContent = t.title;
    const panel = document.getElementById('formPanel');
    panel.innerHTML = '';
    t.groups.forEach(g => {
      const groupEl = document.createElement('div');
      groupEl.className = 'group';

      const h2 = document.createElement('h2');
      h2.textContent = g.title;
      groupEl.appendChild(h2);

      g.fields.forEach(f => {
        const fieldEl = document.createElement('div');
        fieldEl.className = 'field';

        const label = document.createElement('label');
        const thSpan = document.createElement('span');
        thSpan.textContent = f.th + (f.required ? ' *' : '');
        label.appendChild(thSpan);
        if(f.en){
          const enSpan = document.createElement('span');
          enSpan.className = 'en' + (f.required ? ' req' : '');
          enSpan.textContent = f.en;
          label.appendChild(enSpan);
        }
        fieldEl.appendChild(label);

        const input = document.createElement('input');
        input.type = f.type || 'text';
        input.id = f.id;
        input.placeholder = f.placeholder || '';
        input.value = f.default || '';
        input.addEventListener('input', renderPreview);
        fieldEl.appendChild(input);

        groupEl.appendChild(fieldEl);
      });

      if(g.hint){
        const hint = document.createElement('p');
        hint.className = 'hint';
        hint.textContent = g.hint;
        groupEl.appendChild(hint);
      }

      panel.appendChild(groupEl);
    });
  }

  function buildHtml(){
    const t = TEMPLATES[activeKey];
    let out = document.getElementById(t.tplId).textContent;
    allFields(t).forEach(f => {
      const val = document.getElementById(f.id).value.trim();
      const token = '{{' + f.id.toUpperCase() + '}}';
      out = out.replaceAll(token, esc(val));
    });
    return out.trim();
  }

  function renderPreview(){
    const t = TEMPLATES[activeKey];
    document.getElementById('previewFrame').srcdoc = buildHtml();

    const bar = document.getElementById('statusBar');
    bar.innerHTML = '';
    allFields(t).filter(f => f.required).forEach(f => {
      const filled = !!document.getElementById(f.id).value.trim();
      const span = document.createElement('span');
      span.className = 'pill ' + (filled ? 'ok' : 'missing');
      span.textContent = (filled ? '✓ ' : '✗ ') + f.th;
      bar.appendChild(span);
    });
  }

  function showToast(msg){
    const tEl = document.getElementById('toast');
    tEl.textContent = msg;
    tEl.classList.add('show');
    setTimeout(() => tEl.classList.remove('show'), 1800);
  }

  document.getElementById('btnCopy').addEventListener('click', async () => {
    const html = buildHtml();
    try{
      await navigator.clipboard.writeText(html);
      showToast('✅ Copy HTML แล้ว — ไปวางใน Zoho ได้เลย');
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = html;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('✅ Copy HTML แล้ว');
    }
  });

  document.getElementById('btnDownload').addEventListener('click', () => {
    const html = buildHtml();
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const accountField = document.getElementById('account_name');
    const safeName = ((accountField && accountField.value) || activeKey + '-welcome-email')
      .toLowerCase().replace(/[^a-z0-9]+/g,'-');
    a.href = url;
    a.download = safeName + '.html';
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btnSample').addEventListener('click', () => {
    const t = TEMPLATES[activeKey];
    Object.entries(t.sample).forEach(([id, val]) => {
      const el = document.getElementById(id);
      if (el) el.value = val;
    });
    renderPreview();
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    renderForm();
    renderPreview();
  });

  renderTabs();
  renderForm();
  renderPreview();
</script>
